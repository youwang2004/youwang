interface:
  display_name: "支付通道论文精读"
  short_description: "沿论文章节完整译读，用本篇模型图讲透动机、交易、算法和推导"
  default_prompt: "请用 $payment-channel-paper-reader 按原文章节完整译读，难句就近解释。用同一场景走一遍旧办法和本文办法，把受限动作、具体后果和设计取舍画在引言对应段旁。背景图与交易总览沿用本篇模型图的角色、边界、线型与配色，优先展开作者原例；自选参数请注明。正文沿图讲清实际交互，算法先给调用式再解释，各方计算与消息端点对齐。篇末用公式分列图复盘同一次执行，交付整合 Markdown。"
