interface:
  display_name: "支付通道论文精读"
  short_description: "精读区块链支付通道论文，重建交互时序、交易状态与算法改造，逐项定位原文证据"
  default_prompt: "请用 $payment-channel-paper-reader 完整精读论文，先梳理章节、协议主阶段及子阶段，按原文顺序展开全部算法、完整推导及其对本文的作用；符号先总览并在每处使用时解释，把实际公式、消息参数、校验和状态变化融入一整套 LaTeX 多方交互图，每图说明用途与过程，安全模型和形式化证明简述，最后仅交付含可查看原图与展开公式文本的 UTF-8 Markdown，不自动生成 PDF、压缩包或重复算法截图。"
