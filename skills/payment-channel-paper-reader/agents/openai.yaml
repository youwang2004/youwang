interface:
  display_name: "支付通道论文精读"
  short_description: "精读区块链支付通道论文，重建交互时序、交易状态与算法改造，逐项定位原文证据"
  default_prompt: "请用 $payment-channel-paper-reader 全文精读这篇论文，先讲研究问题与协议故事，按原文顺序讲清基础算法再推进流程；算法用完整调用式表示输入、保留 Output 并以 LaTeX 排出编号步骤，逐项核对原文横线等符号；用参与方分列的协议图贯穿参数，解释每项校验目的、状态与失败去向，对照原图推导公式和严格时序，最后交付含原图的本地 UTF-8 Markdown 文档与文件链接。"
