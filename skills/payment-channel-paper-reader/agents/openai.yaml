interface:
  display_name: "支付通道论文精读"
  short_description: "沿论文章节完整译读，用本篇模型图讲透动机、交易、算法和推导"
  default_prompt: "请用 $payment-channel-paper-reader 按原文逐小节完整译读，把难点解释放在对应译文旁。用同一场景讲清引言中的因果和设计取舍。沿本篇拓扑重排一张足宽的支付交互总图，优先沿用作者原例，教学取值另注。逐跳画清发送、转发、返回的实际端点与必要载荷，保留原文公式、字体含义和状态变化。正文就地展开算法与详图，篇末用公式分列图复盘同一次执行，交付整合 Markdown。"
